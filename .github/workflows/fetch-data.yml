name: Fetch Market Data
on:
  schedule:
    # Twice-daily on US market weekdays. Times are UTC.
    # During EDT (March-November):
    #   - 14:30 UTC = 10:30 AM ET (1 hour after market open, opening volatility settled)
    #   - 21:00 UTC = 5:00 PM ET  (1 hour after market close, end-of-day data settled)
    # During EST (November-March), these run 1 hour earlier in ET terms (9:30 AM / 4:00 PM ET).
    - cron: "30 14 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run fetch script
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: node scripts/fetch.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +'%Y-%m-%dT%H:%M')Z"
          git push
